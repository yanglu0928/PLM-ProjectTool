          $dist = Join-Path $env:RUNNER_TEMP "plm-a50-frontend"
          $manifest = Get-Content -LiteralPath (Join-Path $dist "cloud-build-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne $env:GITHUB_SHA -or [string]$manifest.workflow_run -ne $env:GITHUB_RUN_ID -or $manifest.release_eligible -ne $false) { throw "A50 Edge frontend artifact provenance mismatch" }
          if (-not (Test-Path (Join-Path $dist "index.html"))) { throw "A50 Edge frontend artifact incomplete" }
          Remove-Item -LiteralPath (Join-Path $dist "cloud-build-manifest.json") -Force
      - name: Verify A50 harness syntax on hosted Node
        shell: pwsh
        run: |
          node --check validation/hnd-action-source-location-edge/run.mjs
          if ($LASTEXITCODE -ne 0) { throw "A50 hosted Edge harness syntax check failed" }
      - name: Run synthetic Handover navigation in hosted Edge on D-drive temp
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $summary = Join-Path $env:RUNNER_TEMP "plm-a50-edge-summary.json"
          node validation/hnd-action-source-location-edge/run.mjs --dist (Join-Path $env:RUNNER_TEMP "plm-a50-frontend") --summary-out $summary
          if ($LASTEXITCODE -ne 0) { throw "A50 Edge source navigation acceptance failed" }
      - name: Upload A50 Edge synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: plm-a50-edge-source-navigation-${{ github.sha }}
          path: ${{ runner.temp }}/plm-a50-edge-summary.json
          if-no-files-found: error
          retention-days: 14
