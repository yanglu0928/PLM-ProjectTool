          $currentSummary = Get-Content (Join-Path $env:RUNNER_TEMP "plm-a35-current-chunks/verification-summary.json") -Raw | ConvertFrom-Json
          if ($oldSummary.source_commit -ne "2e20a1f5f907ae88e5f194d1c2196fe1657bc2e5" -or $oldSummary.workflow_run -ne "40995913354") { throw "A35 A31 provenance changed" }
          if ($currentSummary.source_commit -ne $env:GITHUB_SHA -or $currentSummary.workflow_run -ne $env:GITHUB_RUN_ID) { throw "A35 current-run provenance mismatch" }
