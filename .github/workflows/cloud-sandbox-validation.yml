      - name: Split candidates into digest-bound transfer chunks
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $oldDir = Join-Path $env:RUNNER_TEMP "plm-a35-old-candidate"
          $currentDir = Join-Path $env:RUNNER_TEMP "plm-a35-current-candidate"
          python .\tools\transfer_parent_candidate_chunks.py split --input-dir $oldDir --output-dir (Join-Path $env:RUNNER_TEMP "plm-a35-old-chunks") --prefix old
          if ($LASTEXITCODE -ne 0) { throw "A35 old candidate chunking failed" }
          python .\tools\transfer_parent_candidate_chunks.py split --input-dir $currentDir --output-dir (Join-Path $env:RUNNER_TEMP "plm-a35-current-chunks") --prefix current
          if ($LASTEXITCODE -ne 0) { throw "A35 current candidate chunking failed" }
          $oldManifest = Get-Content (Join-Path $env:RUNNER_TEMP "plm-a35-old-chunks/chunk-manifest.json") -Raw | ConvertFrom-Json
          $currentManifest = Get-Content (Join-Path $env:RUNNER_TEMP "plm-a35-current-chunks/chunk-manifest.json") -Raw | ConvertFrom-Json
          if ($oldManifest.chunks.Count -ne 8 -or $currentManifest.chunks.Count -ne 8) { throw "A35 expected eight bounded chunks per candidate" }
          if ($oldManifest.source_archive_sha256 -ne "f4d417998ba18bb340fb3d39d83a5c356ac73109a894c1f214852f6b72ed4d49") { throw "A35 A31 candidate ZIP digest changed" }
