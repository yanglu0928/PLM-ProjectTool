  run-out-p25-real-http-edge:
    name: P25 real Output Create HTTP failure closed in hosted Edge
    needs: [frontend, rebuild-pg18-sidecar, assemble-parent-candidate]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install backend dependencies with temporary paths on D
        working-directory: apps/backend
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PIP_CACHE_DIR: ${{ runner.temp }}/plm-p25-pip-cache
        run: |
          python -m pip install --disable-pip-version-check -e ".[test]"
          if ($LASTEXITCODE -ne 0) { throw "P25 backend dependency setup failed" }
      - name: Download same-run frontend production build
        uses: actions/download-artifact@v4
        with:
          name: plm-frontend-dist-${{ github.sha }}
          path: ${{ runner.temp }}/plm-out-p25-frontend
      - name: Download same-run rebuilt PostgreSQL 18.6 sidecar
        uses: actions/download-artifact@v4
        with:
          name: plm-pg18-rebuilt-sidecar-${{ github.sha }}
          path: ${{ runner.temp }}/plm-out-p25-pg-input
      - name: Download same-run Windows parent candidate
        uses: actions/download-artifact@v4
        with:
          name: plm-windows-parent-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/plm-out-p25-parent-input
      - name: Verify D-drive inputs and P25 harness syntax
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $temp = (Resolve-Path $env:RUNNER_TEMP).Path
          if ([IO.Path]::GetPathRoot($temp).TrimEnd('\') -ne "D:") { throw "P25 requires D: runner temp" }
          $dist = Join-Path $env:RUNNER_TEMP "plm-out-p25-frontend"
          $manifestPath = Join-Path $dist "cloud-build-manifest.json"
          $build = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($build.source_commit -ne $env:GITHUB_SHA -or [string]$build.workflow_run -ne $env:GITHUB_RUN_ID -or $build.release_eligible -ne $false) { throw "P25 frontend provenance mismatch" }
          if (-not (Test-Path (Join-Path $dist "index.html"))) { throw "P25 frontend build incomplete" }
          Remove-Item -LiteralPath $manifestPath -Force
          $pgInput = Join-Path $env:RUNNER_TEMP "plm-out-p25-pg-input"
          foreach ($name in @("NOT-FOR-RELEASE-windows-pg18-pgvector-runtime.zip", "sidecar-sha256.json", "pg18-rebuilt-summary.json")) {
            if (-not (Test-Path (Join-Path $pgInput $name))) { throw "P25 same-run PG18 sidecar artifact incomplete" }
          }
          node --check validation/out-01-a01-p25-real-http-edge/run.mjs
          if ($LASTEXITCODE -ne 0) { throw "P25 Edge harness syntax failed" }
          python -B -c "import ast,pathlib; ast.parse(pathlib.Path('validation/out-01-a01-p25-real-http-edge/run.py').read_text(encoding='utf-8'))"
          if ($LASTEXITCODE -ne 0) { throw "P25 HTTP harness syntax failed" }
          python -B -c "import ast,pathlib; ast.parse(pathlib.Path('validation/out-01-a01-p25-real-http-edge/compare_parent_pg.py').read_text(encoding='utf-8'))"
          if ($LASTEXITCODE -ne 0) { throw "P25 parent PostgreSQL comparison syntax failed" }
          $parentInput = Join-Path $env:RUNNER_TEMP "plm-out-p25-parent-input"
          if (-not (Test-Path (Join-Path $parentInput "verification-summary.json"))) { throw "P25 parent candidate summary missing" }
      - name: Run established parent-package PG smoke inside the P25 job on D-drive temp
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $parentInput = Join-Path $env:RUNNER_TEMP "plm-out-p25-parent-input"
          $parent = Get-ChildItem -LiteralPath $parentInput -Filter "NOT-FOR-RELEASE-windows-parent-*.zip" | Select-Object -First 1
          $verification = Join-Path $parentInput "verification-summary.json"
          if (-not $parent -or -not (Test-Path -LiteralPath $verification)) { throw "P25 same-job smoke candidate inputs are incomplete" }
          $workRoot = Join-Path $env:RUNNER_TEMP ("plm-p25-parent-smoke-" + $env:GITHUB_RUN_ID)
          $summary = Join-Path $env:RUNNER_TEMP ("plm-p25-parent-smoke-summary-" + $env:GITHUB_RUN_ID + ".json")
          python -B .\tools\smoke_windows_parent_package_pg_cloud.py --archive $parent.FullName --verification-summary $verification --work-root $workRoot --summary-out $summary --p25-initdb-profile-diagnostic --retain-parent-extraction-for-p25
          if ($LASTEXITCODE -ne 0) { throw "P25 same-job parent PostgreSQL smoke failed; stop before P25 initdb differential and HTTP/Edge" }
          if (-not (Test-Path -LiteralPath $summary)) { throw "P25 same-job parent PostgreSQL smoke summary missing" }
          Get-Content -LiteralPath $summary -Raw
      - name: Compare same-run parent package PostgreSQL startup on D-drive temp
        shell: pwsh
        run: |
          $parentInput = Join-Path $env:RUNNER_TEMP "plm-out-p25-parent-input"
          $parent = Get-ChildItem -LiteralPath $parentInput -Filter "NOT-FOR-RELEASE-windows-parent-*.zip" | Select-Object -First 1
          if (-not $parent) { throw "P25 parent package candidate archive missing" }
          $pgInput = Join-Path $env:RUNNER_TEMP "plm-out-p25-pg-input"
          $compare = Join-Path $env:RUNNER_TEMP ("plm-out-p25-parent-pg-" + $env:GITHUB_RUN_ID + ".json")
          python -B validation/out-01-a01-p25-real-http-edge/compare_parent_pg.py --parent $parent.FullName --sidecar (Join-Path $pgInput "NOT-FOR-RELEASE-windows-pg18-pgvector-runtime.zip") --sidecar-sha (Join-Path $pgInput "sidecar-sha256.json") --output $compare --run-id $env:GITHUB_RUN_ID --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "P25 PostgreSQL differential comparison failed" }
          Get-Content -LiteralPath $compare -Raw
      - name: Run real Output HTTP and Edge failure-closed flow on D-drive temp
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $summary = Join-Path $env:RUNNER_TEMP ("plm-out-p25-summary-" + $env:GITHUB_RUN_ID + ".json")
          $pgInput = Join-Path $env:RUNNER_TEMP "plm-out-p25-pg-input"
          $parentRoot = Join-Path $env:RUNNER_TEMP ("plm-p25-parent-smoke-" + $env:GITHUB_RUN_ID)
          $parentSmoke = Join-Path $env:RUNNER_TEMP ("plm-p25-parent-smoke-summary-" + $env:GITHUB_RUN_ID + ".json")
          python -B validation/out-01-a01-p25-real-http-edge/run.py --dist (Join-Path $env:RUNNER_TEMP "plm-out-p25-frontend") --sidecar (Join-Path $pgInput "NOT-FOR-RELEASE-windows-pg18-pgvector-runtime.zip") --sidecar-sha (Join-Path $pgInput "sidecar-sha256.json") --summary-out $summary --run-id $env:GITHUB_RUN_ID --source-commit $env:GITHUB_SHA --parent-package-root $parentRoot --parent-smoke-summary $parentSmoke
          if ($LASTEXITCODE -ne 0) { throw "P25 real HTTP + hosted Edge failure-closed validation failed" }
          if (-not (Test-Path $summary)) { throw "P25 bounded result summary missing" }
      - name: Clean retained P25 parent package extraction on D-drive temp
        if: always()
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $runner = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path
          if ([IO.Path]::GetPathRoot($runner).TrimEnd('\') -ne "D:") { throw "P25 cleanup requires D-drive RUNNER_TEMP" }
          $leaf = "plm-p25-parent-smoke-" + $env:GITHUB_RUN_ID
          $target = Join-Path $runner $leaf
          if (Test-Path -LiteralPath $target) {
            $item = Get-Item -LiteralPath $target -Force
            $resolved = (Resolve-Path -LiteralPath $target).Path
            if ($item.PSIsContainer -ne $true -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                [IO.Path]::GetPathRoot($resolved).TrimEnd('\') -ne "D:" -or
                [IO.Path]::GetDirectoryName($resolved) -ne $runner -or
                [IO.Path]::GetFileName($resolved) -ne $leaf) { throw "P25 cleanup rejected an unexpected target" }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }
      - name: Upload P25 real HTTP and Edge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plm-out-p25-real-http-edge-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plm-out-p25-summary-${{ github.run_id }}.json
            ${{ runner.temp }}/plm-out-p25-parent-pg-${{ github.run_id }}.json
            ${{ runner.temp }}/plm-p25-parent-smoke-summary-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 14

