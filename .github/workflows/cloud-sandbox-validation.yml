name: Cloud sandbox validation

on:
  push:
    branches:
      - feature/cloud-sandbox-execution
      - feature/cloud-build-artifacts
      - feature/p51-embedded-runtime-cache
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and wheel
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run backend test suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build backend wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Create build provenance manifest
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          $digest = (Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            source_commit = "${{ github.sha }}"
            workflow_run = $env:GITHUB_RUN_ID
            component = "backend-wheel"
            file = $wheel.Name
            sha256 = $digest
            release_eligible = $false
          } | ConvertTo-Json
          Set-Content -Path dist/cloud-build-manifest.json -Value $manifest -Encoding utf8
      - name: Upload backend wheel
        uses: actions/upload-artifact@v4
        with:
          name: plm-backend-wheel-${{ github.sha }}
          path: apps/backend/dist/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test
      - name: Typecheck and build frontend
        run: pnpm build
      - name: Create build provenance manifest
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("dist")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          manifest = {
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run": os.environ["GITHUB_RUN_ID"],
              "component": "frontend-dist",
              "files": {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
              "release_eligible": False,
          }
          (root / "cloud-build-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload frontend production files
        uses: actions/upload-artifact@v4
        with:
          name: plm-frontend-dist-${{ github.sha }}
          path: apps/frontend/dist/
          if-no-files-found: error
          retention-days: 14

  rebuild-pg18-sidecar:
    name: Rebuild PG18 and pgvector sidecar from pinned public inputs
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rebuild and independently hash the non-release sidecar
        shell: pwsh
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP ("plm-pg18-" + $env:GITHUB_RUN_ID)
          $outputRoot = Join-Path $env:RUNNER_TEMP ("plm-pg18-output-" + $env:GITHUB_RUN_ID)
          & .\tools\rebuild_windows_pg18_cloud_candidate.ps1 -WorkRoot $workRoot -OutputRoot $outputRoot
          if ($LASTEXITCODE -ne 0) { throw "Cloud PG18 rebuild failed" }
      - name: Upload rebuilt non-release PG18 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: plm-pg18-rebuilt-sidecar-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plm-pg18-output-${{ github.run_id }}/*.zip
            ${{ runner.temp }}/plm-pg18-output-${{ github.run_id }}/*.json
          if-no-files-found: error
          retention-days: 14

  rebuild-python-embed:
    name: Rebuild pinned Python 3.13.15 embedded base from official input
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rebuild and probe the non-release embedded runtime
        shell: pwsh
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP ("plm-python-embed-" + $env:GITHUB_RUN_ID)
          $outputRoot = Join-Path $env:RUNNER_TEMP ("plm-python-embed-output-" + $env:GITHUB_RUN_ID)
          python .\tools\rebuild_windows_python_embed_cloud_candidate.py --work-root $workRoot --output-root $outputRoot
          if ($LASTEXITCODE -ne 0) { throw "Cloud Python embed rebuild failed" }
      - name: Upload rebuilt non-release Python runtime base
        uses: actions/upload-artifact@v4
        with:
          name: plm-python-embed-rebuilt-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plm-python-embed-output-${{ github.run_id }}/*.zip
            ${{ runner.temp }}/plm-python-embed-output-${{ github.run_id }}/*.json
          if-no-files-found: error
          retention-days: 14

  rebuild-embedded-backend:
    name: Assemble embedded Python with same-run backend and Windows wheelhouse
    needs: [backend, rebuild-python-embed]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download same-commit backend wheel
        uses: actions/download-artifact@v4
        with:
          name: plm-backend-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/plm-backend-wheel
      - name: Download same-run embedded Python base
        uses: actions/download-artifact@v4
        with:
          name: plm-python-embed-rebuilt-${{ github.sha }}
          path: ${{ runner.temp }}/plm-python-embed-base
      - name: Resolve, install and verify the embedded backend runtime
        shell: pwsh
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP ("plm-embedded-backend-" + $env:GITHUB_RUN_ID)
          $outputRoot = Join-Path $env:RUNNER_TEMP ("plm-embedded-backend-output-" + $env:GITHUB_RUN_ID)
          python .\tools\build_windows_embedded_backend_cloud_candidate.py --work-root $workRoot --output-root $outputRoot --backend-artifact (Join-Path $env:RUNNER_TEMP "plm-backend-wheel") --runtime-artifact (Join-Path $env:RUNNER_TEMP "plm-python-embed-base") --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Cloud embedded backend assembly failed" }
      - name: Upload non-release embedded backend candidate
        uses: actions/upload-artifact@v4
        with:
          name: plm-embedded-backend-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plm-embedded-backend-output-${{ github.run_id }}/*.zip
            ${{ runner.temp }}/plm-embedded-backend-output-${{ github.run_id }}/*.json
          if-no-files-found: error
          retention-days: 14

  assemble-parent-candidate:
    name: Assemble same-run Windows parent package candidate
    needs: [backend, frontend, rebuild-pg18-sidecar, rebuild-embedded-backend]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download same-run backend wheel
        uses: actions/download-artifact@v4
        with:
          name: plm-backend-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/plm-parent/backend
      - name: Download same-run frontend production files
        uses: actions/download-artifact@v4
        with:
          name: plm-frontend-dist-${{ github.sha }}
          path: ${{ runner.temp }}/plm-parent/frontend
      - name: Download same-run PostgreSQL runtime
        uses: actions/download-artifact@v4
        with:
          name: plm-pg18-rebuilt-sidecar-${{ github.sha }}
          path: ${{ runner.temp }}/plm-parent/pg18
      - name: Download same-run embedded backend runtime
        uses: actions/download-artifact@v4
        with:
          name: plm-embedded-backend-${{ github.sha }}
          path: ${{ runner.temp }}/plm-parent/embedded
      - name: Download and audit pinned Caddy 2.11.4 input
        shell: pwsh
        run: |
          $caddyDir = Join-Path $env:RUNNER_TEMP "plm-parent/caddy"
          New-Item -ItemType Directory -Path $caddyDir -Force | Out-Null
          $base = "https://github.com/caddyserver/caddy/releases/download/v2.11.4"
          foreach ($asset in @("windows_amd64.zip", "windows_amd64.sbom", "buildable-artifact.tar.gz", "checksums.txt")) {
            $file = "caddy_2.11.4_$asset"
            Invoke-WebRequest -Uri "$base/$file" -OutFile (Join-Path $caddyDir $file)
          }
          python .\tools\audit_caddy_windows_offline_input.py --input-root $caddyDir --output (Join-Path $caddyDir "caddy-audit.json")
          if ($LASTEXITCODE -ne 0) { throw "Pinned Caddy input audit failed" }
      - name: Assemble and verify non-release parent candidate
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP ("plm-parent-output-" + $env:GITHUB_RUN_ID)
          python .\tools\assemble_windows_parent_package_cloud_candidate.py --backend-dir (Join-Path $env:RUNNER_TEMP "plm-parent/backend") --frontend-dir (Join-Path $env:RUNNER_TEMP "plm-parent/frontend") --pg-dir (Join-Path $env:RUNNER_TEMP "plm-parent/pg18") --embedded-dir (Join-Path $env:RUNNER_TEMP "plm-parent/embedded") --caddy-dir (Join-Path $env:RUNNER_TEMP "plm-parent/caddy") --output-dir $output --source-commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw "Cloud parent package assembly failed" }
      - name: Upload verified non-release parent candidate
        uses: actions/upload-artifact@v4
        with:
          name: plm-windows-parent-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/plm-parent-output-${{ github.run_id }}/*
          if-no-files-found: error
          retention-days: 14

  a17-harness-cloud-path-check:
    name: Verify A17 harness syntax and runner-temp boundary
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate D-drive runner temp and compile harness
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("plm-p51-a27-" + $env:GITHUB_RUN_ID)
          $temp = Join-Path $root "PLMToolTemp"
          if (([IO.Path]::GetPathRoot($root)).TrimEnd('\\') -eq "C:") { throw "A27 requires non-C RUNNER_TEMP" }
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          $env:PYTHONPYCACHEPREFIX = Join-Path $temp "pycache"
          python -B -m py_compile validation/plt-pkg-01-a09-p51-a17-planversion-packaged/verify.py tools/run_a17_packaged_cloud_validation.py tools/package_windows_current_app_candidate.py
          if ($LASTEXITCODE -ne 0) { throw "A17 Python harness syntax validation failed" }
          node --check validation/plt-pkg-01-a09-p51-a17-planversion-packaged/run-edge-browser.mjs
          if ($LASTEXITCODE -ne 0) { throw "A17 Edge harness syntax validation failed" }
          $resolved = (Resolve-Path $temp).Path
          if (-not $resolved.StartsWith($env:RUNNER_TEMP, [StringComparison]::OrdinalIgnoreCase)) { throw "A27 temp escaped RUNNER_TEMP" }
          Remove-Item -LiteralPath $root -Recurse -Force
  assemble-a17-current-app-candidate:
    name: Project same-run parent into A17 validation candidate
    needs: [backend, frontend, assemble-parent-candidate]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download same-run parent, backend wheel, and frontend dist
        uses: actions/download-artifact@v4
        with:
          name: plm-windows-parent-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/plm-a17-parent
      - uses: actions/download-artifact@v4
        with:
          name: plm-backend-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/plm-a17-backend
      - uses: actions/download-artifact@v4
        with:
          name: plm-frontend-dist-${{ github.sha }}
          path: ${{ runner.temp }}/plm-a17-frontend
      - name: Run current-app projection unit tests
        shell: pwsh
        run: |
          python -m unittest tools.tests.test_package_windows_current_app_candidate
          if ($LASTEXITCODE -ne 0) { throw "Current-app projection unit tests failed" }
      - name: Resolve pinned pgvector wheel and build A17 candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("plm-a17-project-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $env:PIP_CACHE_DIR = Join-Path $root "pip-cache"
          $vector = Join-Path $root "wheelhouse"
          New-Item -ItemType Directory -Path $vector -Force | Out-Null
          python -m pip download --no-deps --only-binary=:all: --dest $vector "pgvector==0.5.0"
          if ($LASTEXITCODE -ne 0) { throw "Pinned pgvector wheel retrieval failed" }
          $parentArchive = Get-ChildItem (Join-Path $env:RUNNER_TEMP "plm-a17-parent") -Filter "*.zip" | Select-Object -First 1
          $parentSummary = Join-Path $env:RUNNER_TEMP "plm-a17-parent/verification-summary.json"
          $backendDir = Join-Path $env:RUNNER_TEMP "plm-a17-backend"
          $backendWheel = Get-ChildItem $backendDir -Filter "*.whl" | Select-Object -First 1
          $backendManifest = Get-Content -LiteralPath (Join-Path $backendDir "cloud-build-manifest.json") -Raw | ConvertFrom-Json
          $frontend = Join-Path $env:RUNNER_TEMP "plm-a17-frontend"
          $frontendManifest = Get-Content -LiteralPath (Join-Path $frontend "cloud-build-manifest.json") -Raw | ConvertFrom-Json
          if (-not $parentArchive -or -not (Test-Path $parentSummary) -or -not $backendWheel -or -not (Test-Path (Join-Path $frontend "index.html"))) { throw "Same-run A17 candidate inputs incomplete" }
          $summary = Get-Content -LiteralPath $parentSummary -Raw | ConvertFrom-Json
          $backendHash = (Get-FileHash -LiteralPath $backendWheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($backendManifest.source_commit -ne $env:GITHUB_SHA -or [string]$backendManifest.workflow_run -ne $env:GITHUB_RUN_ID -or $backendManifest.release_eligible -ne $false -or $backendManifest.sha256 -ne $backendHash) { throw "Backend artifact provenance/hash mismatch" }
          if ($frontendManifest.source_commit -ne $env:GITHUB_SHA -or [string]$frontendManifest.workflow_run -ne $env:GITHUB_RUN_ID -or $frontendManifest.release_eligible -ne $false) { throw "Frontend artifact provenance mismatch" }
          Remove-Item -LiteralPath (Join-Path $frontend "cloud-build-manifest.json") -Force
          if ($summary.source_commit -ne $env:GITHUB_SHA -or [string]$summary.workflow_run -ne $env:GITHUB_RUN_ID -or $summary.release_eligible -ne $false -or $summary.legal_clearance -ne $false) { throw "Parent provenance/state mismatch" }
          $output = Join-Path $root "output"
          New-Item -ItemType Directory -Path $output | Out-Null
          python ./tools/package_windows_current_app_candidate.py --parent $parentArchive.FullName --wheel $backendWheel.FullName --pgvector-wheel (Get-ChildItem $vector -Filter "*.whl" | Select-Object -First 1).FullName --frontend-dist $frontend --output-parent $output --source-commit $env:GITHUB_SHA --expected-parent-sha256 $summary.archive_sha256 --expected-workflow-run $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw "A17 current-app candidate projection failed" }
          $result = Get-ChildItem $output -Recurse -Filter "verification-summary.json" | Select-Object -First 1
          if (-not $result) { throw "A17 projection summary missing" }
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "plm-a17-candidate-output") -Force | Out-Null
          Copy-Item -LiteralPath $result.FullName -Destination (Join-Path $env:RUNNER_TEMP "plm-a17-candidate-output/verification-summary.json")
          Copy-Item -LiteralPath (Join-Path $result.Directory.FullName "NOT-FOR-RELEASE-windows11-current-app.zip") -Destination (Join-Path $env:RUNNER_TEMP "plm-a17-candidate-output/")
      - name: Upload same-run A17 validation candidate
        uses: actions/upload-artifact@v4
        with:
          name: plm-a17-current-app-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/plm-a17-candidate-output/*
          if-no-files-found: error
          retention-days: 14

  run-a17-packaged-planversion:
    name: A17 packaged PlanVersion Edge HTTPS PostgreSQL flow
    needs: [assemble-a17-current-app-candidate]
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install harness dependencies on runner temp
        working-directory: apps/backend
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP ("plm-a17-harness-deps-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          $env:TEMP = $installRoot
          $env:TMP = $installRoot
          $env:PIP_CACHE_DIR = Join-Path $installRoot "pip-cache"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed" }
          python -m pip install -e ".[test]"
          if ($LASTEXITCODE -ne 0) { throw "A17 harness dependency install failed" }
          Remove-Item -LiteralPath $installRoot -Recurse -Force
      - name: Download same-run A17 current-app candidate
        uses: actions/download-artifact@v4
        with:
          name: plm-a17-current-app-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/plm-a17-run-input
      - name: Run packaged PlanVersion flow in isolated D-drive temp
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("plm-p51-a27-" + $env:GITHUB_RUN_ID)
          $summary = Join-Path $env:RUNNER_TEMP ("plm-p51-a27-result-" + $env:GITHUB_RUN_ID + ".json")
          $candidate = Get-ChildItem (Join-Path $env:RUNNER_TEMP "plm-a17-run-input") -Filter "*.zip" | Select-Object -First 1
          $candidateSummary = Join-Path $env:RUNNER_TEMP "plm-a17-run-input/verification-summary.json"
          if (-not $candidate -or -not (Test-Path $candidateSummary)) { throw "A17 candidate artifact incomplete" }
          python ./tools/run_a17_packaged_cloud_validation.py --candidate $candidate.FullName --verification-summary $candidateSummary --run-root $root --summary-out $summary
          if ($LASTEXITCODE -ne 0) { throw "Packaged A17 PlanVersion Edge/HTTPS/PG flow failed" }
          if (-not (Test-Path $summary)) { throw "A17 success summary missing" }
      - name: Upload bounded A17 business-flow evidence
        uses: actions/upload-artifact@v4
        with:
          name: plm-a17-planversion-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/plm-p51-a27-result-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14

  smoke-parent-postgresql:
    name: Clean extraction and temporary PostgreSQL lifecycle smoke
    needs: [assemble-parent-candidate]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download same-run non-release parent candidate
        uses: actions/download-artifact@v4
        with:
          name: plm-windows-parent-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/plm-parent-smoke-input
      - name: Extract on runner temp and smoke PostgreSQL/pgvector
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP ("plm-parent-pg-smoke-" + $env:GITHUB_RUN_ID)
          $out = Join-Path $env:RUNNER_TEMP ("plm-parent-pg-smoke-summary-" + $env:GITHUB_RUN_ID)
          $archive = Get-ChildItem (Join-Path $env:RUNNER_TEMP "plm-parent-smoke-input") -Filter "*.zip" | Select-Object -First 1
          $summary = Join-Path $env:RUNNER_TEMP "plm-parent-smoke-input/verification-summary.json"
          if (-not $archive -or -not (Test-Path $summary)) { throw "Parent candidate artifact is incomplete" }
          python .\tools\smoke_windows_parent_package_pg_cloud.py --archive $archive.FullName --verification-summary $summary --work-root $work --summary-out (Join-Path $out "pg-smoke.json")
          if ($LASTEXITCODE -ne 0) { throw "Parent package PostgreSQL smoke failed" }
      - name: Upload bounded PostgreSQL smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: plm-parent-pg-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/plm-parent-pg-smoke-summary-${{ github.run_id }}/pg-smoke.json
          if-no-files-found: error
          retention-days: 14
