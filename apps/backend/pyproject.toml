[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plm-project-tool-backend"
version = "0.1.0.dev0"
description = "Backend for the PLM project implementation assistant"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
test = [
  "httpx2==2.13.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["plm_assistant*"]
