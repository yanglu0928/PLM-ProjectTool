# Non-sensitive bootstrap settings only. Never add passwords, API keys or tokens.
# Windows example; on Debian use an absolute path such as /opt/plmtool/data.
bind_host: "127.0.0.1"
bind_port: 8000
data_root: "C:/PLMTool/data"
log_level: "INFO"
# Shared reset/change KDF slots per process; login/create are not included.
# Strict integer 1..16. Changing requires restart; workers multiply the budget.
# Higher capacity needs memory planning; this is not a performance guarantee.
password_kdf_slots: 4
# Set only after the operator selects a MAC actually present on this machine.
# selected_mac: "02:11:22:33:44:55"
# Parser Worker only: all three non-sensitive values are required for its
# offline OCR startup. Copy vetted PP-OCRv5 model files into these directories;
# record the composite SHA-256 fingerprint from the approved model manifest.
# No automatic download or guessed fingerprint is permitted.
# parser_ocr_detection_model_dir: "C:/PLMTool/app/models/PP-OCRv5_mobile_det"
# parser_ocr_recognition_model_dir: "C:/PLMTool/app/models/PP-OCRv5_mobile_rec"
# parser_ocr_model_fingerprint: "<64 lowercase hex characters>"
